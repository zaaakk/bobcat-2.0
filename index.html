<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bobcat — Chihuahuan Desert</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400;1,700&family=Lora:ital,wght@0,400..700;1,400..700&family=Syne+Tactile&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: dark;
        --ui-blue: #1a2e6b;
        --ui-blue-deep: #0a1638;
        --ui-red: #9c1a1a;
        --ui-brown: #3a261c;
        --ui-tan: #b39568;
        --ui-ink: #f0e6d0;
        --ui-ink-dim: #b9aa8a;
        --panel-fill: linear-gradient(180deg, #2a2418 0%, #15110b 100%);
        --panel-edge-light: #4f3a26;
        --panel-edge-dark: #0a0805;
      }
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        background: #14100c;
        font-family: 'Work Sans', sans-serif;
        color: var(--ui-ink);
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; image-rendering: auto; }

      /* Chiseled bevel: light top/left, dark bottom/right, plus a thick centred frame.
         This is the early-2000s "stamped panel" look — solid, not translucent. */
      .panel {
        background: var(--panel-fill);
        border: 3px solid var(--panel-edge-dark);
        box-shadow:
          inset 0 0 0 1px var(--panel-edge-light),
          inset 0 2px 0 0 rgba(255, 220, 170, 0.06),
          inset 0 -2px 0 0 rgba(0, 0, 0, 0.55),
          0 4px 0 0 rgba(0, 0, 0, 0.55);
      }

      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background:
          radial-gradient(circle at center, rgba(26, 46, 107, 0.32) 0%, rgba(10, 22, 56, 0.08) 30%, transparent 60%),
          linear-gradient(180deg, #1a1410 0%, #07050a 100%);
        z-index: 100; transition: opacity 0.6s ease;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
      #loading h1 {
        font-family: 'Almendra', serif; font-weight: 700; letter-spacing: 0.32em; font-size: 28px;
        color: var(--ui-tan); margin: 0 0 28px 0; text-transform: uppercase;
        text-shadow: 1px 1px 0 #000, 0 0 14px rgba(156, 26, 26, 0.35);
      }
      #loading .bar {
        width: 320px; height: 14px; background: #08060a;
        border: 3px solid var(--panel-edge-dark);
        box-shadow: inset 0 0 0 1px var(--panel-edge-light), 0 3px 0 0 rgba(0,0,0,0.6);
      }
      #loading .bar > div {
        height: 100%; width: 0%;
        background: repeating-linear-gradient(90deg,
          var(--ui-red) 0px, var(--ui-red) 7px,
          #6e1212 7px, #6e1212 14px);
        transition: width 0.25s ease;
      }
      #loading .status {
        margin-top: 16px; font-family: 'Work Sans', sans-serif; font-weight: 700;
        font-size: 11px; color: var(--ui-ink-dim);
        letter-spacing: 0.32em; text-transform: uppercase;
      }

      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

      /* Compass — chunky stamped panel, thicker centre needle, no thin lines */
      #compass {
        position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
        width: 280px; height: 38px;
        background: var(--panel-fill);
        border: 3px solid var(--panel-edge-dark);
        box-shadow:
          inset 0 0 0 1px var(--panel-edge-light),
          inset 0 2px 0 0 rgba(255, 220, 170, 0.06),
          inset 0 -2px 0 0 rgba(0, 0, 0, 0.55),
          0 4px 0 0 rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }
      #compass-strip {
        position: absolute; top: 0; height: 38px; display: flex; align-items: center;
        color: var(--ui-ink); font-family: 'Work Sans', sans-serif;
        font-size: 12px; font-weight: 800; letter-spacing: 0.36em;
        text-shadow: 1px 1px 0 #000;
      }
      #compass-strip span { display: inline-block; width: 60px; text-align: center; }
      #compass-needle {
        position: absolute; top: 4px; left: 50%; width: 4px; height: 30px;
        background: var(--ui-red);
        box-shadow: -1px 0 0 0 #5a0a0a, 1px 0 0 0 #d84444;
        transform: translateX(-50%);
      }

      /* Portrait — stamped frame, no rounded corners, thick edge */
      #portrait {
        position: absolute; bottom: 22px; left: 22px;
        width: 84px; height: 84px;
        background: var(--panel-fill);
        border: 3px solid var(--panel-edge-dark);
        box-shadow:
          inset 0 0 0 1px var(--panel-edge-light),
          inset 0 2px 0 0 rgba(255, 220, 170, 0.06),
          inset 0 -2px 0 0 rgba(0, 0, 0, 0.55),
          0 4px 0 0 rgba(0, 0, 0, 0.55);
        overflow: hidden;
        image-rendering: pixelated;
      }
      #portrait img {
        width: 100%; height: 100%; object-fit: cover;
        filter: saturate(0.78) contrast(1.18);
      }
      #portrait-name {
        position: absolute; left: 120px; bottom: 64px;
        font-family: 'Almendra', serif; font-size: 22px; font-weight: 700;
        letter-spacing: 0.18em; color: var(--ui-tan);
        text-shadow: 2px 2px 0 #000;
      }
      #portrait-sub {
        position: absolute; left: 120px; bottom: 38px;
        font-family: 'Work Sans', sans-serif; font-weight: 700; font-size: 11px;
        letter-spacing: 0.24em; color: var(--ui-ink-dim);
        text-transform: uppercase; text-shadow: 1px 1px 0 #000;
      }
      /* Coordinates readout under the name, sourced from main.js */
      #portrait-coords {
        position: absolute; left: 120px; bottom: 20px;
        font-family: 'Work Sans', sans-serif; font-weight: 700; font-size: 11px;
        letter-spacing: 0.18em; color: var(--ui-tan);
        text-transform: uppercase; text-shadow: 1px 1px 0 #000;
      }

      /* Minimap — square stamped panel, not a circle. Reads as an icon, not a HUD blur. */
      #minimap {
        position: absolute; bottom: 22px; right: 22px;
        width: 168px; height: 168px;
        background: var(--panel-fill);
        border: 3px solid var(--panel-edge-dark);
        box-shadow:
          inset 0 0 0 1px var(--panel-edge-light),
          inset 0 2px 0 0 rgba(255, 220, 170, 0.06),
          inset 0 -2px 0 0 rgba(0, 0, 0, 0.55),
          0 4px 0 0 rgba(0, 0, 0, 0.55);
        overflow: hidden;
        image-rendering: pixelated;
      }
      #minimap canvas { width: 100%; height: 100%; image-rendering: pixelated; }
      #minimap-marker {
        position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
        background: var(--ui-red);
        border: 2px solid var(--ui-ink);
        transform: translate(-50%, -50%) rotate(45deg);
      }

      /* Help block — solid panel, blocky monospaced labels */
      #help {
        position: absolute; top: 18px; left: 18px;
        padding: 12px 14px;
        font-family: 'Work Sans', sans-serif; font-weight: 700; font-size: 11px;
        letter-spacing: 0.18em; color: var(--ui-ink-dim);
        text-transform: uppercase; line-height: 1.9;
        background: var(--panel-fill);
        border: 3px solid var(--panel-edge-dark);
        box-shadow:
          inset 0 0 0 1px var(--panel-edge-light),
          inset 0 2px 0 0 rgba(255, 220, 170, 0.06),
          inset 0 -2px 0 0 rgba(0, 0, 0, 0.55),
          0 4px 0 0 rgba(0, 0, 0, 0.55);
        text-shadow: 1px 1px 0 #000;
      }
      #help b {
        display: inline-block; min-width: 5em;
        color: var(--ui-tan); font-weight: 900;
      }

      #telemetry {
        position: absolute; top: 18px; right: 18px;
        min-width: 96px; padding: 8px 12px 10px;
        background: var(--panel-fill);
        border: 3px solid var(--panel-edge-dark);
        box-shadow:
          inset 0 0 0 1px var(--panel-edge-light),
          inset 0 2px 0 0 rgba(255, 220, 170, 0.06),
          inset 0 -2px 0 0 rgba(0, 0, 0, 0.55),
          0 4px 0 0 rgba(0, 0, 0, 0.55);
        text-align: right;
        text-shadow: 1px 1px 0 #000;
      }
      #telemetry-label {
        font-family: 'Work Sans', sans-serif; font-weight: 800; font-size: 10px;
        letter-spacing: 0.36em; text-transform: uppercase; color: var(--ui-ink-dim);
      }
      #fps-readout {
        margin-top: 2px; font-family: 'Almendra', serif; font-weight: 700;
        font-size: 22px; color: var(--ui-tan); letter-spacing: 0.06em;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div id="help">
        <div><b>W A S D</b> &nbsp; move</div>
        <div><b>Shift</b> &nbsp; sprint</div>
        <div><b>Mouse</b> &nbsp; look</div>
      </div>
      <div id="telemetry">
        <div id="telemetry-label">FPS</div>
        <div id="fps-readout">000</div>
      </div>
      <div id="compass">
        <div id="compass-strip"></div>
        <div id="compass-needle"></div>
      </div>
      <div id="portrait">
        <img src="/assets/profile.png" alt="bobcat" />
      </div>
      <div id="portrait-name">LYNX RUFUS</div>
      <div id="portrait-sub">Pandale, Val Verde Co.</div>
      <div id="portrait-coords">N 30.16°  W 101.56°</div>
      <div id="minimap">
        <canvas width="320" height="320"></canvas>
        <div id="minimap-marker"></div>
      </div>
    </div>

    <div id="loading">
      <h1>Chihuahuan Desert</h1>
      <div class="bar"><div id="loading-bar"></div></div>
      <div class="status" id="loading-status">Loading terrain…</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
