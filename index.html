<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bobcat — Chihuahuan Desert</title>
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        background: #14100c;
        color: #f0e6d0;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; image-rendering: auto; }

      /* HUD container — sprite-built children. */
      #hud {
        position: fixed; inset: 0; pointer-events: none; z-index: 50;
      }

      /* Loading screen — flat dark background, no gradients. */
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #0c0a08;
        z-index: 100; transition: opacity 0.6s linear;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="loading"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
