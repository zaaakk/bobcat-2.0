<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bobcat — Chihuahuan Desert</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1815; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #f1ebd9; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }

      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at center, #2a241a 0%, #100c08 100%);
        z-index: 100; transition: opacity 0.6s ease;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
      #loading h1 { font-weight: 200; letter-spacing: 0.4em; font-size: 14px; color: #d8c98c; margin: 0 0 24px 0; text-transform: uppercase; }
      #loading .bar { width: 280px; height: 2px; background: rgba(255,255,255,0.08); overflow: hidden; }
      #loading .bar > div { height: 100%; width: 0%; background: #d8c98c; transition: width 0.25s ease; }
      #loading .status { margin-top: 12px; font-size: 11px; color: #8a8270; letter-spacing: 0.2em; text-transform: uppercase; }

      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

      #compass {
        position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
        width: 220px; height: 28px; background: rgba(0,0,0,0.35); border-radius: 14px;
        overflow: hidden; backdrop-filter: blur(6px);
      }
      #compass-strip { position: absolute; top: 0; height: 28px; display: flex; align-items: center; color: #f1ebd9; font-size: 11px; letter-spacing: 0.25em; }
      #compass-strip span { display: inline-block; width: 60px; text-align: center; opacity: 0.85; }
      #compass-needle { position: absolute; top: 0; left: 50%; width: 1px; height: 28px; background: #d8c98c; box-shadow: 0 0 4px #d8c98c; }

      #portrait {
        position: absolute; bottom: 22px; left: 22px;
        width: 86px; height: 86px; border-radius: 50%;
        background: rgba(0,0,0,0.35); border: 2px solid rgba(216,201,140,0.6);
        overflow: hidden; backdrop-filter: blur(6px);
      }
      #portrait img { width: 100%; height: 100%; object-fit: cover; filter: saturate(0.85) contrast(1.05); }
      #portrait-name {
        position: absolute; left: 116px; bottom: 38px;
        font-size: 14px; letter-spacing: 0.25em; color: #f1ebd9; text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      }
      #portrait-sub {
        position: absolute; left: 116px; bottom: 22px;
        font-size: 10px; letter-spacing: 0.3em; color: #d8c98c; text-transform: uppercase;
      }

      #minimap {
        position: absolute; bottom: 22px; right: 22px;
        width: 160px; height: 160px; border-radius: 50%;
        background: rgba(0,0,0,0.35); border: 2px solid rgba(216,201,140,0.6);
        overflow: hidden; backdrop-filter: blur(6px);
      }
      #minimap canvas { width: 100%; height: 100%; }
      #minimap-marker {
        position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
        background: #ff8a3d; border: 1.5px solid #fff; border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 6px rgba(255,138,61,0.8);
      }

      #help {
        position: absolute; top: 18px; left: 18px; font-size: 10px; letter-spacing: 0.2em;
        color: rgba(241,235,217,0.65); text-transform: uppercase; line-height: 1.8;
      }
      #help b { color: #d8c98c; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div id="help">
        <div><b>W A S D</b> &nbsp; move</div>
        <div><b>Shift</b> &nbsp; sprint</div>
        <div><b>Mouse</b> &nbsp; look</div>
      </div>
      <div id="compass">
        <div id="compass-strip"></div>
        <div id="compass-needle"></div>
      </div>
      <div id="portrait">
        <img src="/assets/profile.png" alt="bobcat" />
      </div>
      <div id="portrait-name">LYNX RUFUS</div>
      <div id="portrait-sub">Pandale, Val Verde Co.</div>
      <div id="minimap">
        <canvas width="320" height="320"></canvas>
        <div id="minimap-marker"></div>
      </div>
    </div>

    <div id="loading">
      <h1>Chihuahuan Desert</h1>
      <div class="bar"><div id="loading-bar"></div></div>
      <div class="status" id="loading-status">Loading terrain…</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
